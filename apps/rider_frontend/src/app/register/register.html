<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>

<body class="bg-[#F2F2F7] min-h-screen p-4">

    <!-- mobile layout (default) -->
    <h1 class="text-3xl font-bold text-[#1C1C1E] min-w-70">Rider Registration</h1>

    <div class="border border-black w-full mt-10 sm:flex min-w-70">
        <!-- PERSONAL INFORMATION BLOCK -->
        <div class="border border-black w-full sm:w-1/2 p-4">
            <h2 class="text-xl font-bold text-[#1C1C1E]">Personal Information</h2>
            <!-- form inputs container -->
            <div class = "w-full">

                <div class="flex flex-wrap gap-5 mx-auto w-fit mt-3 pl-3">
                    <input type="text" placeholder="Full Nam"
                        class="border border-gray-400 rounded px-2 py-1 text-lg mt-1" />
                    <input type="email" placeholder="Email"
                        class="border border-gray-400 rounded px-2 py-1 text-lg mt-1" />
                    <input type="number" placeholder="Whatsapp Number"
                        class="border border-gray-400 rounded px-2 py-1 text-lg mt-1" />
                </div>
            </div>
        </div>

        <!-- vehicles and documents -->
        <div class="border border-black w-full sm:w-1/2 p-4">
            <h2 class="text-xl font-bold text-[#1C1C1E]">Vehicles and Documents</h2>

            <!-- form inputs container -->
            <div class="w-full">
                <div class="flex flex-wrap gap-5 mx-auto w-fit mt-3 pl-3">
                    <input type="text" placeholder="vehicle name and model"
                        class="border border-gray-400 rounded px-2 py-1 text-lg mt-1" />
                </div>
            </div>

        </div>
    </div>
</body>

</html>
