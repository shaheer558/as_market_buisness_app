<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Orders</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Hide scrollbar for cleaner look */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-[#F2F2F7] min-h-screen flex flex-col scrollbar-hide">

    <!-- ==================== Header Bar (theme: 56px, white, shadow) ==================== -->
    <div class="relative bg-white shadow-sm border-b border-[#D1D1D6] mb-[clamp(20px,3vw,32px)]"
        style="margin-left: calc(-1 * clamp(16px, 3vw, 40px)); margin-right: calc(-1 * clamp(16px, 3vw, 40px));">

        <!-- Hamburger menu icon (right side) -->
        <button class="absolute right-[clamp(12px,3vw,24px)] top-1/2 -translate-y-1/2 cursor-pointer p-2"
            style="min-width:44px; min-height:44px;">
            <svg xmlns="http://www.w3.org/2000/svg" class="fill-[#1C1C1E]"
                style="width: clamp(20px, 3vw, 24px); height: clamp(20px, 3vw, 24px);" viewBox="0 0 640 640">
                <path
                    d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z" />
            </svg>
        </button>

        <div style="padding: clamp(12px, 2vw, 16px) clamp(16px, 3vw, 40px);" class="flex items-center justify-center">
            <h1 class="font-bold text-[#1C1C1E]" style="font-size: clamp(20px, 3.5vw, 22px);">
                Available Orders
            </h1>
        </div>
    </div>

    <!-- ==================== Base & Cash Info Bar ==================== -->
    <div class="flex flex-wrap justify-between items-center px-[clamp(16px,3vw,32px)] mb-[clamp(8px,1.5vw,12px)]"
        style="gap: clamp(8px, 2vw, 16px);">
        <span class="flex items-center gap-1" style="font-size: clamp(13px, 1.8vw, 15px);">
            <span class="font-semibold text-[#1C1C1E]">Base:</span>
            <span class="text-[#6E6E73]">Gulberg</span>
        </span>
        <span class="flex items-center gap-1" style="font-size: clamp(13px, 1.8vw, 15px);">
            <span class="font-semibold text-[#1C1C1E]">Cash:</span>
            <span class="text-[#1C1C1E] font-medium">Rs. 2,500</span>
            <span class="text-[#6E6E73]">/ Rs. 10,000</span>
        </span>
    </div>

    <!-- ==================== Cash Limit Indicator Bar ==================== -->
    <div class="px-[clamp(16px,3vw,32px)] mb-[clamp(12px,2vw,20px)]">
        <div class="w-full h-1.5 bg-[#E5E5EA] rounded-full overflow-hidden">
            <div class="h-full bg-[#30D158] rounded-full" style="width: 25%; transition: width 0.3s;"></div>
        </div>
    </div>

    <!-- ==================== Sort Note ==================== -->
    <div class="px-[clamp(16px,3vw,32px)] mb-[clamp(12px,2vw,16px)]">
        <p class="text-[#6E6E73] italic" style="font-size: clamp(12px, 1.5vw, 13px);">
            Sorted by product size, then delivery region
        </p>
    </div>

    <!-- Divider -->
    <div class="px-[clamp(16px,3vw,32px)] mb-[clamp(16px,2.5vw,24px)]">
        <hr class="border-[#D1D1D6]">
    </div>

    <!-- ==================== Order Cards Grid ==================== -->
    <div class="flex-1 px-[clamp(16px,3vw,32px)]">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-[clamp(12px,2vw,16px)] max-w-225 mx-auto">

            <!-- ====== Card 1: MEDIUM – ESCALATED ====== -->
            <label class="h-full cursor-pointer block">
                <input type="checkbox" class="peer hidden">
                <div class="h-full bg-white rounded-xl p-[clamp(14px,2vw,16px)] shadow-sm border-2 border-[#D1D1D6]
                            peer-checked:border-[#0A84FF] peer-checked:bg-[#F0F6FF] transition-all duration-200">

                    <!-- Header: size + item count badge -->
                    <div class="flex items-center justify-between mb-[clamp(10px,1.5vw,14px)]">
                        <h2 class="font-semibold text-[#1C1C1E]" style="font-size: clamp(15px, 2vw, 17px);">
                            MEDIUM
                        </h2>
                        <span class="bg-[#0A84FF] text-white rounded-full flex items-center justify-center font-medium"
                            style="font-size: clamp(12px, 1.5vw, 13px); min-width: clamp(22px, 3vw, 26px); height: clamp(22px, 3vw, 26px);">
                            2
                        </span>
                    </div>

                    <!-- Shops -->
                    <p class="text-[#1C1C1E]" style="font-size: clamp(13px, 1.6vw, 15px); line-height: 1.4;">
                        Pick from <span class="font-semibold">2</span> shops:
                    </p>
                    <p class="text-[#6E6E73] mt-0.5" style="font-size: clamp(12px, 1.4vw, 13px);">
                        Al‑Fatah, Imtiaz
                    </p>

                    <!-- Distance & Profit row -->
                    <div class="flex items-center justify-between mt-[clamp(10px,1.5vw,14px)]">
                        <span class="text-[#6E6E73]" style="font-size: clamp(12px, 1.4vw, 13px);">
                            ~3.2 km
                        </span>
                        <span class="text-[#30D158] font-bold" style="font-size: clamp(14px, 1.8vw, 15px);">
                            +Rs. 30
                        </span>
                    </div>

                    <!-- ESCALATED badge -->
                    <div class="flex items-center gap-1 mt-[clamp(8px,1vw,12px)]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="fill-[#FF9F0A]"
                            style="width: clamp(16px, 2vw, 18px); height: clamp(16px, 2vw, 18px);"
                            viewBox="0 0 640 640">
                            <path
                                d="M320 64C334.7 64 348.2 72.1 355.2 85L571.2 485C577.9 497.4 577.6 512.4 570.4 524.5C563.2 536.6 550.1 544 536 544L104 544C89.9 544 76.8 536.6 69.6 524.5C62.4 512.4 62.1 497.4 68.8 485L284.8 85C291.8 72.1 305.3 64 320 64zM320 416C302.3 416 288 430.3 288 448C288 465.7 302.3 480 320 480C337.7 480 352 465.7 352 448C352 430.3 337.7 416 320 416zM320 224C301.8 224 287.3 239.5 288.6 257.7L296 361.7C296.9 374.2 307.4 384 319.9 384C332.5 384 342.9 374.3 343.8 361.7L351.2 257.7C352.5 239.5 338.1 224 319.8 224z" />
                        </svg>
                        <span class="text-[#FF9F0A] font-medium uppercase tracking-wide"
                            style="font-size: clamp(11px, 1.3vw, 13px);">
                            Escalated
                        </span>
                    </div>
                </div>
            </label>

            <!-- ====== Card 2: SMALL – SELECTED ====== -->
            <label class="h-full cursor-pointer block">
                <input type="checkbox" class="peer hidden" checked>
                <div
                    class="h-full bg-[#F0F6FF] rounded-xl p-[clamp(14px,2vw,16px)] shadow-sm border-2 border-[#0A84FF] transition-all duration-200">

                    <div class="flex items-center justify-between mb-[clamp(10px,1.5vw,14px)]">
                        <h2 class="font-semibold text-[#1C1C1E]" style="font-size: clamp(15px, 2vw, 17px);">
                            SMALL
                        </h2>
                        <span class="bg-[#0A84FF] text-white rounded-full flex items-center justify-center font-medium"
                            style="font-size: clamp(12px, 1.5vw, 13px); min-width: clamp(22px, 3vw, 26px); height: clamp(22px, 3vw, 26px);">
                            5
                        </span>
                    </div>

                    <p class="text-[#1C1C1E]" style="font-size: clamp(13px, 1.6vw, 15px); line-height: 1.4;">
                        Pick from <span class="font-semibold">1</span> shop:
                    </p>
                    <p class="text-[#6E6E73] mt-0.5" style="font-size: clamp(12px, 1.4vw, 13px);">
                        Imtiaz Store
                    </p>

                    <div class="flex items-center justify-between mt-[clamp(10px,1.5vw,14px)]">
                        <span class="text-[#6E6E73]" style="font-size: clamp(12px, 1.4vw, 13px);">
                            ~1.8 km
                        </span>
                        <span class="text-[#30D158] font-bold" style="font-size: clamp(14px, 1.8vw, 15px);">
                            +Rs. 20
                        </span>
                    </div>
                </div>
            </label>

            <!-- ====== Card 3: SMALL – SELECTED ====== -->
            <label class="h-full cursor-pointer block">
                <input type="checkbox" class="peer hidden" checked>
                <div
                    class="h-full bg-[#F0F6FF] rounded-xl p-[clamp(14px,2vw,16px)] shadow-sm border-2 border-[#0A84FF] transition-all duration-200">

                    <div class="flex items-center justify-between mb-[clamp(10px,1.5vw,14px)]">
                        <h2 class="font-semibold text-[#1C1C1E]" style="font-size: clamp(15px, 2vw, 17px);">
                            SMALL
                        </h2>
                        <span class="bg-[#0A84FF] text-white rounded-full flex items-center justify-center font-medium"
                            style="font-size: clamp(12px, 1.5vw, 13px); min-width: clamp(22px, 3vw, 26px); height: clamp(22px, 3vw, 26px);">
                            3
                        </span>
                    </div>

                    <p class="text-[#1C1C1E]" style="font-size: clamp(13px, 1.6vw, 15px); line-height: 1.4;">
                        Pick from <span class="font-semibold">2</span> shops:
                    </p>
                    <p class="text-[#6E6E73] mt-0.5" style="font-size: clamp(12px, 1.4vw, 13px);">
                        HKB Grocery, Daily
                    </p>

                    <div class="flex items-center justify-between mt-[clamp(10px,1.5vw,14px)]">
                        <span class="text-[#6E6E73]" style="font-size: clamp(12px, 1.4vw, 13px);">
                            ~0.9 km
                        </span>
                        <span class="text-[#30D158] font-bold" style="font-size: clamp(14px, 1.8vw, 15px);">
                            +Rs. 15
                        </span>
                    </div>
                </div>
            </label>

            <!-- ====== Card 4: VERY SMALL ====== -->
            <label class="h-full cursor-pointer block">
                <input type="checkbox" class="peer hidden">
                <div class="h-full bg-white rounded-xl p-[clamp(14px,2vw,16px)] shadow-sm border-2 border-[#D1D1D6]
                            peer-checked:border-[#0A84FF] peer-checked:bg-[#F0F6FF] transition-all duration-200">

                    <div class="flex items-center justify-between mb-[clamp(10px,1.5vw,14px)]">
                        <h2 class="font-semibold text-[#1C1C1E]" style="font-size: clamp(15px, 2vw, 17px);">
                            VERY SMALL
                        </h2>
                        <span class="bg-[#0A84FF] text-white rounded-full flex items-center justify-center font-medium"
                            style="font-size: clamp(12px, 1.5vw, 13px); min-width: clamp(22px, 3vw, 26px); height: clamp(22px, 3vw, 26px);">
                            1
                        </span>
                    </div>

                    <p class="text-[#1C1C1E]" style="font-size: clamp(13px, 1.6vw, 15px); line-height: 1.4;">
                        Pick from <span class="font-semibold">1</span> shop:
                    </p>
                    <p class="text-[#6E6E73] mt-0.5" style="font-size: clamp(12px, 1.4vw, 13px);">
                        Daily Mart
                    </p>

                    <div class="flex items-center justify-between mt-[clamp(10px,1.5vw,14px)]">
                        <span class="text-[#6E6E73]" style="font-size: clamp(12px, 1.4vw, 13px);">
                            ~3.5 km
                        </span>
                        <span class="text-[#30D158] font-bold" style="font-size: clamp(14px, 1.8vw, 15px);">
                            +Rs. 10
                        </span>
                    </div>
                </div>
            </label>

        </div>
    </div>

    <!-- ==================== Preview Button (CTA) ==================== -->
    <div class="flex justify-center mt-[clamp(24px,4vw,40px)] mb-[clamp(12px,2vw,20px)] px-[clamp(16px,3vw,32px)]">
        <button
            class="bg-[#0A84FF] hover:bg-[#0066CC] text-white font-bold rounded-xl shadow-sm flex items-center justify-center gap-3 cursor-pointer transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-[#0A84FF] focus:ring-offset-2"
            style="font-size: clamp(15px, 2vw, 17px); height: clamp(44px, 7vw, 48px); padding: 0 clamp(20px, 4vw, 32px); min-width: clamp(200px, 40vw, 300px);">
            <span>Preview Selection</span>
            <span class="bg-white text-[#0A84FF] rounded-full flex items-center justify-center font-bold"
                style="font-size: clamp(12px, 1.5vw, 14px); min-width: clamp(22px, 3vw, 26px); height: clamp(22px, 3vw, 26px);">
                2
            </span>
        </button>
    </div>

    <!-- ==================== Real-time update footer ==================== -->
    <div class="flex items-center justify-center gap-2 text-[#6E6E73] pb-[clamp(16px,3vw,24px)]"
        style="font-size: clamp(12px, 1.5vw, 13px);">
        <svg xmlns="http://www.w3.org/2000/svg" class="fill-[#FF9F0A]"
            style="width: clamp(14px, 1.8vw, 16px); height: clamp(14px, 1.8vw, 16px);" viewBox="0 0 640 640">
            <path
                d="M434.8 54.1C446.7 62.7 451.1 78.3 445.7 91.9L367.3 288L512 288C525.5 288 537.5 296.4 542.1 309.1C546.7 321.8 542.8 336 532.5 344.6L244.5 584.6C233.2 594 217.1 594.5 205.2 585.9C193.3 577.3 188.9 561.7 194.3 548.1L272.7 352L128 352C114.5 352 102.5 343.6 97.9 330.9C93.3 318.2 97.2 304 107.5 295.4L395.5 55.4C406.8 46 422.9 45.5 434.8 54.1z" />
        </svg>
        <span>Stale orders are removed in real time</span>
    </div>

</body>

</html>
