<div class="bg-[#F2F2F7] min-h-screen flex flex-col scrollbar-hide">
  <!-- ==================== Header Bar ==================== -->
  <div class="relative bg-white shadow-sm border-b border-[#D1D1D6] shrink-0"
       style="margin-left: calc(-1 * clamp(16px, 3vw, 40px)); margin-right: calc(-1 * clamp(16px, 3vw, 40px));">
    <button class="absolute left-[clamp(12px,3vw,24px)] top-1/2 -translate-y-1/2 cursor-pointer p-2"
            style="min-width:44px; min-height:44px;" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" class="fill-[#1C1C1E]"
           style="width: clamp(20px, 3vw, 24px); height: clamp(20px, 3vw, 24px);" viewBox="0 0 640 640">
        <path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/>
      </svg>
    </button>
    <div style="padding: clamp(12px, 2vw, 16px) clamp(16px, 3vw, 40px);" class="flex items-center justify-center">
      <h1 class="font-bold text-[#1C1C1E]" style="font-size: clamp(20px, 3.5vw, 22px);">Shop Stop</h1>
    </div>
  </div>

  <!-- Shop Info -->
  <div class="px-[clamp(16px,3vw,32px)] mt-[clamp(12px,2vw,16px)] mb-[clamp(4px,0.8vw,8px)]">
    <h2 class="text-[#1C1C1E] font-semibold" style="font-size: clamp(18px, 2.5vw, 22px);">Imtiaz Store</h2>
    <p class="text-[#6E6E73]" style="font-size: clamp(14px, 1.8vw, 16px);">
      Expected Bill: <span class="text-[#1C1C1E] font-medium">Rs. 12,450</span>
    </p>
  </div>

  <hr class="border-[#D1D1D6] mx-[clamp(16px,3vw,32px)] mb-[clamp(16px,2.5vw,24px)]">

  <!-- Main Content: Checklist + Actions + Payment -->
  <div class="flex-1 px-[clamp(16px,3vw,32px)] pb-[clamp(16px,3vw,24px)]">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-[clamp(16px,2.5vw,24px)] max-w-225 mx-auto">

      <!-- Left: Items Checklist -->
      <div class="bg-white rounded-xl shadow-sm border border-[#D1D1D6] p-[clamp(16px,2.5vw,20px)]">
        <h3 class="text-[#1C1C1E] font-semibold mb-[clamp(12px,1.8vw,16px)]"
            style="font-size: clamp(17px, 2vw, 17px);">Items to Pick</h3>
        <div class="space-y-[clamp(10px,1.5vw,14px)]">
          <label *ngFor="let item of items" class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" [(ngModel)]="item.picked"
                   class="w-5 h-5 text-[#0A84FF] border-gray-300 rounded focus:ring-[#0A84FF]">
            <span class="text-[#1C1C1E]" style="font-size: clamp(14px, 1.6vw, 15px);"
                  [class.line-through]="item.picked" [class.text-[#6E6E73]]="item.picked">
              {{ item.name }} ×{{ item.quantity }}
            </span>
          </label>
        </div>
      </div>

      <!-- Right: Product Actions + Payment sections -->
      <div class="flex flex-col gap-[clamp(12px,2vw,16px)]">

        <!-- Product Actions Card -->
        <div class="bg-white rounded-xl shadow-sm border border-[#D1D1D6] p-[clamp(16px,2.5vw,20px)]">
          <h3 class="text-[#1C1C1E] font-semibold mb-[clamp(12px,1.8vw,16px)]"
              style="font-size: clamp(17px, 2vw, 17px);">Product Actions</h3>
          <div class="space-y-[clamp(10px,1.5vw,14px)]">
            <button (click)="openUpdatePrice()"
                    class="w-full h-[clamp(44px,7vw,48px)] border-2 border-[#0A84FF] text-[#0A84FF] hover:bg-[#0A84FF]/5 font-bold rounded-xl transition-colors cursor-pointer bg-white"
                    style="font-size: clamp(14px, 1.6vw, 15px);">
              Update Price
            </button>
            <button (click)="productNotAvailable()"
                    class="w-full h-[clamp(44px,7vw,48px)] border-2 border-[#FF9F0A] text-[#FF9F0A] hover:bg-[#FFF3E0] font-bold rounded-xl transition-colors cursor-pointer bg-white"
                    style="font-size: clamp(14px, 1.6vw, 15px);">
              Product Not Available
            </button>
            <button (click)="confirmWishlistAvail()"
                    class="w-full h-[clamp(44px,7vw,48px)] border-2 border-[#0A84FF] text-[#0A84FF] hover:bg-[#0A84FF]/5 font-bold rounded-xl transition-colors cursor-pointer bg-white"
                    style="font-size: clamp(14px, 1.6vw, 15px);">
              Confirm Wishlist Avail
            </button>
          </div>
        </div>

        <!-- Payment Section (Direct Payment if no price change) -->
        <div class="bg-white rounded-xl shadow-sm border border-[#D1D1D6] p-[clamp(16px,2.5vw,20px)]">
          <h3 class="text-[#1C1C1E] font-semibold mb-[clamp(12px,1.8vw,16px)]"
              style="font-size: clamp(17px, 2vw, 17px);">Pay Shop Owner</h3>
          <p class="text-[#6E6E73] mb-[clamp(8px,1.2vw,12px)]" style="font-size: clamp(12px, 1.4vw, 14px);">
            If the bill matches the expected amount.
          </p>
          <input type="text" [(ngModel)]="shopkeeperAccount"
                 class="w-full h-12 px-3 border border-[#D1D1D6] rounded-lg text-[#1C1C1E] placeholder-[#6E6E73] focus:outline-none focus:border-[#0A84FF] focus:ring-2 focus:ring-[#0A84FF]/20 transition mb-[clamp(10px,1.5vw,14px)]"
                 style="font-size: clamp(14px, 1.6vw, 15px);"
                 placeholder="Easypaisa / Jazzcash / Bank account">
          <button (click)="payShopOwnerDirect()"
                  class="w-full h-[clamp(44px,7vw,48px)] bg-[#0A84FF] hover:bg-[#0066CC] text-white font-bold rounded-xl shadow-sm transition-colors cursor-pointer"
                  style="font-size: clamp(14px, 1.6vw, 15px);"
                  [disabled]="!shopkeeperAccount.trim()">
            Pay Shop Owner (Rs. 12,450)
          </button>
        </div>

        <!-- Pending / Approved Price Update banner -->
         @if(priceUpdateStatus === 'pending'){
        <div
             class="bg-[#FFF3E0] border border-[#FF9F0A] rounded-xl p-[clamp(12px,1.8vw,16px)] text-center">
          <p class="text-[#FF9F0A] font-semibold" style="font-size: clamp(14px, 1.6vw, 15px);">
            Price update request pending approval.
          </p>
          <button (click)="openUpdatePrice()"
                  class="mt-2 text-[#0A84FF] font-medium underline hover:no-underline"
                  style="font-size: clamp(13px, 1.5vw, 14px);">
            View request
          </button>
        </div>
      }
        @if(priceUpdateStatus === 'approved'){
        <div
             class="bg-[#E8F5E9] border border-[#30D158] rounded-xl p-[clamp(12px,1.8vw,16px)]">
          <p class="text-[#30D158] font-semibold mb-2" style="font-size: clamp(14px, 1.6vw, 15px);">
            Price update approved!
          </p>
          <input type="text" [(ngModel)]="shopkeeperAccount"
                 class="w-full h-12 px-3 border border-[#D1D1D6] rounded-lg text-[#1C1C1E] placeholder-[#6E6E73] focus:outline-none focus:border-[#0A84FF] focus:ring-2 focus:ring-[#0A84FF]/20 transition mb-2"
                 style="font-size: clamp(14px, 1.6vw, 15px);"
                 placeholder="Shopkeeper account (if not already entered)">
          <button (click)="payShopOwnerAfterApproval()"
                  class="w-full h-[clamp(44px,7vw,48px)] bg-[#30D158] hover:bg-[#2EBD50] text-white font-bold rounded-xl shadow-sm transition-colors cursor-pointer"
                  style="font-size: clamp(14px, 1.6vw, 15px);"
                  [disabled]="!shopkeeperAccount.trim()">
            Pay Shop Owner
          </button>
        </div>
      }

      </div>
    </div>

    <!-- SHOP DONE Button (centered) -->
    <div class="flex justify-center mt-[clamp(24px,4vw,32px)]">
      <button (click)="shopDone()"
              class="w-full md:w-auto px-[clamp(32px,6vw,48px)] h-[clamp(44px,7vw,48px)] bg-[#0A84FF] hover:bg-[#0066CC] text-white font-bold rounded-xl shadow-sm transition-colors cursor-pointer"
              style="font-size: clamp(15px, 1.8vw, 17px);">
        SHOP DONE
      </button>
    </div>
  </div>
</div>
