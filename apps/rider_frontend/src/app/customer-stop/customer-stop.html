<div class="bg-[#F2F2F7] min-h-screen flex flex-col scrollbar-hide">
  <!-- ==================== Header Bar ==================== -->
  <div class="relative bg-white shadow-sm border-b border-[#D1D1D6] shrink-0"
       style="margin-left: calc(-1 * clamp(16px, 3vw, 40px)); margin-right: calc(-1 * clamp(16px, 3vw, 40px));">
    <!-- <button class="absolute left-[clamp(12px,3vw,24px)] top-1/2 -translate-y-1/2 cursor-pointer p-2"
            style="min-width:44px; min-height:44px;" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" class="fill-[#1C1C1E]"
           style="width: clamp(20px, 3vw, 24px); height: clamp(20px, 3vw, 24px);" viewBox="0 0 640 640">
        <path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/>
      </svg>
    </button> -->
    <div style="padding: clamp(12px, 2vw, 16px) clamp(16px, 3vw, 40px);" class="flex items-center justify-center">
      <h1 class="font-bold text-[#1C1C1E]" style="font-size: clamp(20px, 3.5vw, 22px);">Customer Delivery</h1>
    </div>
  </div>

  <!-- ==================== Main Content ==================== -->
  <div class="flex-1 px-[clamp(16px,3vw,32px)] py-[clamp(20px,3vw,32px)]">
    <div class="max-w-225 mx-auto">
      <!-- Customer info -->
      <div class="flex flex-wrap items-baseline gap-x-[clamp(16px,3vw,24px)] gap-y-[clamp(4px,0.6vw,8px)] mb-[clamp(16px,2.5vw,24px)]">
        <p class="text-[#1C1C1E] font-semibold" style="font-size: clamp(17px, 2vw, 20px);">
          Customer: <span class="font-bold">Ayesha Iqbal</span>
        </p>
        <p class="text-[#6E6E73]" style="font-size: clamp(15px, 1.8vw, 17px);">
          Address: Garden Town
        </p>
      </div>

      <!-- Order Details Card -->
      <div class="bg-white rounded-xl shadow-sm border border-[#D1D1D6] p-[clamp(16px,2.5vw,24px)] mb-[clamp(20px,3vw,32px)]">
        <h2 class="text-[#1C1C1E] font-semibold mb-[clamp(10px,1.5vw,14px)]"
            style="font-size: clamp(17px, 2vw, 17px);">Order #231 – 5 items</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-[clamp(8px,1.2vw,12px)] mb-[clamp(12px,1.8vw,16px)]">
          <div class="space-y-[clamp(4px,0.6vw,8px)]">
            <p *ngFor="let item of orderItems" class="text-[#1C1C1E]"
               style="font-size: clamp(14px, 1.6vw, 15px);">{{ item }}</p>
          </div>
          <div class="md:text-right space-y-[clamp(8px,1.2vw,12px)]">
            <p class="text-[#1C1C1E] font-medium" style="font-size: clamp(16px, 2vw, 18px);">
              Total: <span class="font-bold">Rs. 12,450</span>
            </p>
            <div>
              <p class="text-[#6E6E73]" style="font-size: clamp(13px, 1.5vw, 15px);">
                Payment: <span class="font-semibold text-[#1C1C1E]">COD</span>
              </p>
              <p class="text-[#FF9F0A] font-medium" style="font-size: clamp(14px, 1.6vw, 16px);">
                Collect Rs. 12,450
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-[clamp(12px,2vw,16px)] mb-[clamp(16px,2.5vw,24px)]">
        <button (click)="promptMarkAsProcessed()"
                class="w-full h-[clamp(48px,7vw,56px)] bg-[#0A84FF] hover:bg-[#0066CC] text-white font-bold rounded-xl shadow-sm transition-colors cursor-pointer"
                style="font-size: clamp(16px, 1.8vw, 18px);">
          MARK AS PROCESSED
        </button>
        <button (click)="notReceived()"
                [disabled]="!isWithin300m"
                class="w-full h-[clamp(48px,7vw,56px)] font-bold rounded-xl transition-colors cursor-pointer"
                [ngClass]="{
                  'border-2 border-[#FF453A] text-[#FF453A] bg-white hover:bg-[#FFF0F0]': isWithin300m,
                  'bg-[#E5E5EA] text-[#6E6E73] cursor-not-allowed': !isWithin300m
                }"
                style="font-size: clamp(16px, 1.8vw, 18px);">
          NOT RECEIVED
          <span *ngIf="!isWithin300m" class="block" style="font-size: clamp(11px, 1.2vw, 13px);">(within 300m only)</span>
        </button>
      </div>

      <!-- Cash limit status -->
      <div class="bg-white rounded-xl shadow-sm border border-[#D1D1D6] p-[clamp(14px,2vw,18px)] flex items-center justify-between">
        <span class="text-[#1C1C1E] font-medium" style="font-size: clamp(14px, 1.6vw, 16px);">Cash Limit Status</span>
        <div class="flex items-center gap-2">
          <span class="text-[#1C1C1E]" style="font-size: clamp(14px, 1.6vw, 16px);">Rs. 2,500 / 10,000</span>
          <div class="w-24 h-2 bg-[#E5E5EA] rounded-full overflow-hidden">
            <div class="h-full bg-[#30D158] rounded-full" style="width: 25%;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== COD Amount Mismatch Modal ==================== -->
  <div *ngIf="showPaymentConfirmation" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-lg p-[clamp(20px,3vw,28px)] w-full max-w-md mx-auto text-center">
    <h2 class="text-[#1C1C1E] font-bold mb-4" style="font-size: clamp(18px, 2.5vw, 20px);">Confirm Payment</h2>
    <p class="text-[#1C1C1E] mb-6" style="font-size: clamp(15px, 1.8vw, 17px);">
      Did the customer pay<br><span class="font-bold">Rs. {{ orderTotal.toLocaleString() }}</span>?
    </p>
    <button (click)="confirmPaymentReceived()"
            class="w-full h-12 bg-[#30D158] hover:bg-[#2EBD50] text-white font-bold rounded-xl shadow-sm transition-colors cursor-pointer mb-3"
            style="font-size: clamp(15px, 1.8vw, 17px);">
      Yes, Cash Received
    </button>
    <button (click)="showPaymentConfirmation = false"
            class="w-full h-12 border-2 border-[#0A84FF] text-[#0A84FF] hover:bg-[#0A84FF]/5 font-bold rounded-xl bg-white"
            style="font-size: clamp(15px, 1.8vw, 17px);">
      Cancel
    </button>
  </div>
</div>
</div>
