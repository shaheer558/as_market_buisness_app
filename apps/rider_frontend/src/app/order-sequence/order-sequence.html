<div class="bg-[#F2F2F7] min-h-screen flex flex-col scrollbar-hide">
  <!-- ==================== Header Bar ==================== -->
  <div class="relative bg-white shadow-sm border-b border-[#D1D1D6] shrink-0"
       style="margin-left: calc(-1 * clamp(16px, 3vw, 40px)); margin-right: calc(-1 * clamp(16px, 3vw, 40px));">
    <!-- Back arrow -->
    <button class="absolute left-[clamp(12px,3vw,24px)] top-1/2 -translate-y-1/2 cursor-pointer p-2"
            style="min-width:44px; min-height:44px;" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" class="fill-[#1C1C1E]"
           style="width: clamp(20px, 3vw, 24px); height: clamp(20px, 3vw, 24px);" viewBox="0 0 640 640">
        <path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/>
      </svg>
    </button>
    <div style="padding: clamp(12px, 2vw, 16px) clamp(16px, 3vw, 40px);" class="flex items-center justify-center">
      <h1 class="font-bold text-[#1C1C1E]" style="font-size: clamp(20px, 3.5vw, 22px);">Order Sequence</h1>
    </div>
  </div>

  <!-- ==================== Order List ==================== -->
  <div class="flex-1 px-[clamp(16px,3vw,32px)] py-[clamp(16px,2.5vw,24px)]">
    @if(orders.length > 0){
    <div class="grid grid-cols-1 md:grid-cols-2 gap-[clamp(12px,2vw,16px)] max-w-225 mx-auto">

      <!-- Order Card -->
      <div *ngFor="let order of orders"
           class="bg-white rounded-xl shadow-sm border border-[#D1D1D6] p-[clamp(14px,2vw,16px)] flex flex-col gap-[clamp(8px,1.2vw,12px)]">

        <!-- Status indicator -->
        <div class="flex items-center gap-2">
          <!-- Status dot -->
          <span class="w-2.5 h-2.5 rounded-full shrink-0"
                [ngClass]="{
                  'bg-[#30D158]': order.status === OrderStatus.DELIVERED,
                  'bg-[#FF9F0A]': order.status === OrderStatus.PICKING,
                  'bg-[#6E6E73]': order.status === OrderStatus.PENDING
                }"></span>
          <span class="font-semibold uppercase tracking-wide"
                [ngClass]="{
                  'text-[#30D158]': order.status === OrderStatus.DELIVERED,
                  'text-[#FF9F0A]': order.status === OrderStatus.PICKING,
                  'text-[#6E6E73]': order.status === OrderStatus.PENDING
                }"
                style="font-size: clamp(13px, 1.5vw, 15px);">
            {{ order.statusLabel }}
          </span>
        </div>

        <!-- Customer info -->
        <div>
          <p class="text-[#1C1C1E] font-medium" style="font-size: clamp(14px, 1.6vw, 15px);">
            {{ order.customerName }}
          </p>
          <p class="text-[#6E6E73]" style="font-size: clamp(12px, 1.3vw, 13px);">
            {{ order.address }} · {{ order.itemCount }} items ({{ order.size }})
          </p>
        </div>
      </div>
    </div>
    }
    @else{
    <!-- Empty state (fallback) -->
      <div class="flex items-center justify-center h-full text-center text-[#6E6E73]"
           style="font-size: clamp(14px, 1.8vw, 16px);">
        <p>No orders in this trip yet.</p>
      </div>
    }
  </div>

  <!-- Footer note -->
  <div class="text-center text-[#6E6E73] pb-[clamp(16px,3vw,24px)]"
       style="font-size: clamp(12px, 1.4vw, 13px);">
    Real‑time updates as stops are completed
  </div>
</div>
